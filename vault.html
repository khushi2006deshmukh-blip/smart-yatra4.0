<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Yatra | My Digital Travel Vault</title>
    <link rel="stylesheet" href="your-plan.css">
    <style>
        body {
            background-color: #040d1a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .vault-container {
            max-width: 850px;
            margin: 0 auto;
        }
        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-back {
            background: #0b1728;
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 8px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-back:hover {
            background: #0e223b;
        }
        .vault-card {
            background: #08111f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
        }
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .form-label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }
        .vault-input {
            width: 100%;
            box-sizing: border-box;
            background: #0c1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            margin-bottom: 14px;
        }
        .vault-input:focus {
            border-color: #38bdf8;
        }
        .btn-save {
            background: #10b981;
            color: #04121b;
            font-weight: 700;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            width: 100%;
        }
        .btn-save:hover { background: #34d399; }
        .doc-preview-box {
            margin-top: 14px;
            border: 2px dashed rgba(56, 189, 248, 0.35);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            background: #060e1b;
        }
        .doc-preview-img {
            max-width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="vault-container">
        <!-- HEADER -->
        <div class="vault-header">
            <div>
                <span style="color: #38bdf8; font-size: 12px; font-weight: bold; letter-spacing: 0.8px; text-transform: uppercase;">OFFLINE EMERGENCY ACCESS</span>
                <h1 style="margin: 5px 0 0 0; font-size: 26px;">🔐 My Yatra Vault</h1>
            </div>
            <a href="your-plan.html" class="btn-back">⬅ Back to Roadmap</a>
        </div>

        <div class="vault-grid">
            <!-- 1. KEY IDENTIFICATION DETAILS -->
            <div class="vault-card">
                <h3 style="margin: 0 0 16px 0; color: #38bdf8; font-size: 17px;">📋 Key Numbers & Notes</h3>
                
                <label class="form-label">Driving Licence Number</label>
                <input type="text" id="vaultDl" class="vault-input" placeholder="e.g. DL-1420110012345">

                <label class="form-label">Aadhaar (Last 4 Digits / Identification)</label>
                <input type="text" id="vaultAadhaar" class="vault-input" placeholder="e.g. XXXX-XXXX-1234">

                <label class="form-label">Emergency Relative Contact</label>
                <input type="text" id="vaultEmergency" class="vault-input" placeholder="e.g. +91 9876543210 (Papa / Brother)">

                <label class="form-label">Blood Group & Medical Notes</label>
                <input type="text" id="vaultMedical" class="vault-input" placeholder="e.g. B+, Carry Asthalin Inhaler">

                <button id="saveVaultBtn" class="btn-save">💾 Save Details to Device</button>
            </div>

            <!-- 2. DOCUMENT PHOTO LOCKER -->
            <div class="vault-card">
                <h3 style="margin: 0 0 6px 0; color: #10b981; font-size: 17px;">🪪 Licence / ID Proof Photo</h3>
                <p style="color: #94a3b8; font-size: 12.5px; margin: 0 0 14px 0;">
                    Hotel check-in ya bike rental counter par bina gallery khoje seedha photo dikhayein.
                </p>

                <input type="file" id="vaultFileInput" accept="image/*" style="display: none;">
                
                <div style="display: flex; gap: 10px;">
                    <button onclick="document.getElementById('vaultFileInput').click()" style="background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">
                        📁 Upload ID Card Image
                    </button>
                    <button id="removeDocBtn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: none;">
                        Remove
                    </button>
                </div>

                <div id="docPreviewContainer" class="doc-preview-box" style="display: none;">
                    <img id="docPreviewImg" class="doc-preview-img" src="" alt="ID Preview" title="Click to open full view">
                    <small style="display: block; color: #64748b; margin-top: 8px;">Tap photo to open full original size</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        // Load saved text details
        let savedVault = {};
        try { savedVault = JSON.parse(localStorage.getItem("smartYatraVault")) || {}; } catch (e) {}

        if ($("vaultDl") && savedVault.dl) $("vaultDl").value = savedVault.dl;
        if ($("vaultAadhaar") && savedVault.aadhaar) $("vaultAadhaar").value = savedVault.aadhaar;
        if ($("vaultEmergency") && savedVault.emergency) $("vaultEmergency").value = savedVault.emergency;
        if ($("vaultMedical") && savedVault.medical) $("vaultMedical").value = savedVault.medical;

        // Save Details
        $("saveVaultBtn").onclick = () => {
            const data = {
                dl: $("vaultDl").value.trim(),
                aadhaar: $("vaultAadhaar").value.trim(),
                emergency: $("vaultEmergency").value.trim(),
                medical: $("vaultMedical").value.trim()
            };
            localStorage.setItem("smartYatraVault", JSON.stringify(data));
            $("saveVaultBtn").textContent = "✅ Saved to Device!";
            setTimeout(() => { $("saveVaultBtn").textContent = "💾 Save Details to Device"; }, 2500);
        };

        // Load saved Image
        const savedImg = localStorage.getItem("smartYatraVaultDoc");
        if (savedImg && $("docPreviewImg")) {
            $("docPreviewImg").src = savedImg;
            $("docPreviewContainer").style.display = "block";
            $("removeDocBtn").style.display = "inline-block";
        }

        // File Upload Handler
        $("vaultFileInput").onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 4 * 1024 * 1024) {
                alert("Kripya 4MB se kam size ki image upload karein.");
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const base64 = event.target.result;
                try {
                    localStorage.setItem("smartYatraVaultDoc", base64);
                    $("docPreviewImg").src = base64;
                    $("docPreviewContainer").style.display = "block";
                    $("removeDocBtn").style.display = "inline-block";
                } catch(err) {
                    alert("Storage limit exceed. Thodi chhoti image select karein.");
                }
            };
            reader.readAsDataURL(file);
        };

        // Remove Document
        $("removeDocBtn").onclick = () => {
            localStorage.removeItem("smartYatraVaultDoc");
            $("docPreviewImg").src = "";
            $("docPreviewContainer").style.display = "none";
            $("removeDocBtn").style.display = "none";
            $("vaultFileInput").value = "";
        };

        // Full Screen Photo View
        $("docPreviewImg").onclick = () => {
            if ($("docPreviewImg").src) {
                const win = window.open("");
                win.document.write(`<img src="${$("docPreviewImg").src}" style="max-width:100%; height:auto; margin:auto; display:block; padding:20px; background:#000;">`);
            }
        };
    </script>
</body>
</html>
